aid: fda-regulations
name: FDA Regulations
x-type: concept
description: 'FDA Regulations is the body of federal rules the U.S. Food and Drug Administration enforces
  over the safety, efficacy and security of food, human and animal drugs, biologics, medical devices,
  cosmetics and tobacco products — codified at 21 CFR and administered through the agency''s inspection,
  citation, import and compliance-action programs. The machine-readable surface for that regulatory activity
  is the FDA Data Dashboard API (DDAPI), published by the FDA Office of Inspections and Investigations
  (formerly the Office of Regulatory Affairs), which serves the same inspection classification, inspection
  citation, import refusal and compliance action datasets that power the public Data Dashboard. Access
  is credentialed: FDA issues an Authorization-User / Authorization-Key header pair on request, and every
  endpoint is a POST search over a single dataset with JSON filters, column projection, sorting and offset
  paging.'
