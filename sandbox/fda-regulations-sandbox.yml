note: >-
  FDA publishes an interactive API console, but no sandbox. Recording the distinction rather
  than blurring it: the "Try It Out!" panel on the documentation page executes real requests
  against the production API using the caller's own live credentials. There is no test mode, no
  test key prefix, no fixture data, no simulated records and no time simulation, because the
  API is read-only over public regulatory data and there is nothing to simulate.
